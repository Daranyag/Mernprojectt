services:
  - type: web
    name: studysense-backend
    env: node
    plan: free
    rootDir: studysense/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 1d
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: GEMINI_API_KEY
        sync: false
